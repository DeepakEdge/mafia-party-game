<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mafia Party</title><link rel="stylesheet" href="style.css"><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><main><header><div><h1>MAFIA <span>PARTY</span></h1><p>Moderator-free party game</p></div><button id="soundBtn" class="ghost">🔊 Narration on</button></header><div id="notice" class="notice hidden"></div>
<section id="home" class="card"><h2>Start or join a game</h2><label>Character name<input id="homeName" maxlength="20" autocomplete="off"></label><div class="grid2"><button id="createBtn">Create room</button><button id="joinToggle" class="secondary">Join room</button></div><div id="joinBox" class="hidden"><label>Room code<input id="roomCode" maxlength="6" autocomplete="off"></label><button id="joinBtn">Join game</button></div><p class="muted" id="resumeHint"></p></section>
<section id="lobby" class="hidden"><div class="card"><div class="row"><div><small>ROOM</small><h2 id="codeText"></h2></div><span id="hostBadge" class="pill"></span></div><div id="hostSetup" class="hidden"><label>Planned players<input id="maxPlayers" type="number" min="4" value="8"></label><div class="grid3"><label>Mafia<input id="mafiaN" type="number" min="1" value="2"></label><label>Doctors<input id="doctorN" type="number" min="0" value="1"></label><label>Detectives<input id="detectiveN" type="number" min="0" value="1"></label></div></div><div class="share"><div id="qr"></div><button id="copyLink" class="secondary">Copy invite link</button></div><h3>Players <span id="playerCount"></span></h3><div id="players" class="players"></div><button id="startBtn" class="hidden">Randomly assign roles & start</button></div></section>
<section id="game" class="hidden"><div class="card roleCard"><small>YOUR SECRET ROLE</small><h2 id="roleText"></h2><p id="roleHelp"></p><button id="hideRole" class="secondary">Hide / show role</button></div><div class="card"><div class="row"><span id="dayBadge" class="pill"></span><span id="phaseBadge" class="pill gold"></span></div><h2 id="phaseTitle"></h2><p id="phaseHelp"></p><div id="actionArea"></div><div id="hostControls" class="hostControls"></div></div><div class="card"><h3 id="rosterTitle">Players</h3><div id="aliveList" class="players"></div></div></section>
</main><script src="config.js"></script><script src="logic.js"></script><script src="app.js"></script></body></html>
